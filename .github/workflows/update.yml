name: Update publication data

on:
  schedule:
    - cron: "23 6 * * *"   # daily, 06:23 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs

concurrency:
  group: update-publication-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the refreshed data/ back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and summarize
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          ORCID_ID: ${{ secrets.ORCID_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          SCHOLAR_USER_ID: ${{ secrets.SCHOLAR_USER_ID }}
          # Slightly under a day, so each daily run refreshes citation counts.
          SCHOLAR_MAX_AGE_HOURS: "20"
          OPENALEX_MAX_AGE_DAYS: "0.8"
        run: python run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update publication data $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
